<!DOCTYPE html>
<html>
<head>
    <title>Test WASM</title>
</head>
<body>
    <h1>Testing WASM Compilation</h1>
    <div id="output"></div>
    
    <script type="module">
        import init, { compile_to_wasm } from './pkg/iris_lang.js';
        
        const output = document.getElementById('output');
        
        async function test() {
            try {
                await init();
                output.innerHTML += 'WASM initialized<br>';
                
                const result = compile_to_wasm('export fn test() -> Int { 42 }');
                output.innerHTML += `Compilation result length: ${result.length}<br>`;
                output.innerHTML += `Result: ${new TextDecoder().decode(result.slice(0, 100))}<br>`;
            } catch (error) {
                output.innerHTML += `Error: ${error.message}<br>`;
            }
        }
        
        test();
    </script>
</body>
</html>
