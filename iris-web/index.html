<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Language Web IDE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #2d2d30;
            padding: 1rem;
            border-bottom: 1px solid #3e3e42;
        }
        
        .header h1 {
            color: #569cd6;
            font-size: 1.5rem;
        }
        
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #3e3e42;
        }
        
        .panel-header {
            background: #252526;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #3e3e42;
            font-weight: bold;
        }
        
        #code-editor {
            flex: 1;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        
        .output-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
        }
        
        .output-content {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .controls {
            background: #2d2d30;
            padding: 1rem;
            border-top: 1px solid #3e3e42;
            display: flex;
            gap: 1rem;
        }
        
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 3px;
            font-family: inherit;
        }
        
        button:hover {
            background: #1177bb;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .error {
            color: #f48771;
        }
        
        .success {
            color: #4ec9b0;
        }
        
        .wasm-output {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 3px;
            padding: 0.5rem;
            margin-top: 0.5rem;
            font-family: monospace;
            font-size: 11px;
            color: #d4d4d4;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌸 Iris Language Web IDE</h1>
    </div>
    
    <div class="main">
        <div class="editor-panel">
            <div class="panel-header">Editor</div>
            <textarea id="code-editor" placeholder="// Enter your Iris code here...
fn add(a: Int, b: Int) -> Int =: a + b

let result
=: 42
:: * 2
:: + 10
// result = 94"></textarea>
        </div>
        
        <div class="output-panel">
            <div class="panel-header">Output</div>
            <div class="output-content" id="output">
                Ready to compile Iris code...
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button id="compile-btn">Compile to WASM</button>
        <button id="run-btn">Run WASM</button>
        <button id="clear-btn">Clear Output</button>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
